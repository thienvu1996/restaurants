<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6efd">
  <title>QR Scanner Demo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./qr-scanner.css">
</head>
<body class="bg-body-tertiary">
  <main class="container py-4 py-md-5">
    <div class="mx-auto" style="max-width: 620px;">
      <div class="text-center mb-4">
        <h1 class="h3 fw-bold">QR Scanner</h1>
        <p class="text-secondary mb-0">HTML + JavaScript + Bootstrap · Component tái sử dụng</p>
      </div>

      <div id="scanner"></div>

      <div class="alert alert-light border mt-3 small mb-0">
        Camera trên điện thoại cần chạy qua <strong>HTTPS</strong> hoặc localhost.
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./qr-scanner.js"></script>
  <script>
    const scanner = new QRScanner("#scanner", {
      title: "Quét mã QR",
      fps: 20,
      qrbox: 250,
      duplicateCooldown: 1000,
      maxHistory: 10,
      onScan(text) {
        console.log("QR:", text);

        // Ví dụ gọi API ERP:
        // fetch(`/api/qr?code=${encodeURIComponent(text)}`)
        //   .then(r => r.json())
        //   .then(data => console.log(data));
      }
    });
  </script>
</body>
</html>
